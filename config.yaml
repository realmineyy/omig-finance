# ─────────────────────────────────────────────────────────────────────────────
# Research engine configuration
# Edit this file (on GitHub or locally) to steer what the nightly build researches.
# ─────────────────────────────────────────────────────────────────────────────

# Every ticker here gets a full deep dive each run: 4-5 years of statements,
# a DCF, trading comps, and price history.
# (OMIG can only hold S&P 500 names, so keep the watchlist inside the index.)
watchlist:
  - AAPL
  - MSFT
  - COST
  - FDX     # Memphis
  - XOM

# The screening universe: every common stock listed on these exchanges
# (~6,000 companies). S&P 500/400/600 membership is tagged for filtering.
# The universe is the S&P 500 — the only stocks OMIG can hold. Every name is
# refreshed and valued each run; budget_minutes caps how long that may take.
universe:
  budget_minutes: 25

# Full models (statements, DCF, comps) are built for the watchlist, the top
# `per_sector` ideas in each of the 11 GICS sectors, the leaders of each saved
# screen, and anything you request from the site.
deep_dives:
  per_sector: 2

# Valuation defaults. The risk-free rate is pulled live from the 10Y Treasury
# (^TNX) each run; the value here is only a fallback.
macro:
  risk_free_rate: 0.043
  equity_risk_premium: 0.050
  terminal_growth: 0.025

# Saved screens. They show up as presets in the dashboard screener, and the
# top `deep_dive_top` names from each get a full deep dive every run.
#
# Numeric filters take {min, max}; `sector` and `industry` take a list.
# Field keys are defined in engine/metrics.py (FIELDS).
screens:
  - id: quality_value
    name: Quality at a fair price
    description: High-return, high-margin businesses with modest leverage, not priced for perfection.
    filters:
      mcap: {min: 2.0e9}
      roe: {min: 0.15}
      op_m: {min: 0.15}
      ev_ebitda: {max: 15}
      net_debt_ebitda: {max: 2.5}
    sort: {key: fcf_yield, desc: true}
    deep_dive_top: 3

  - id: garp
    name: Growth at a reasonable price
    description: Double-digit revenue growth with a forward P/E that hasn't run away.
    filters:
      mcap: {min: 1.0e9}
      rev_g: {min: 0.10}
      fpe: {min: 0, max: 22}
      op_m: {min: 0.08}
    sort: {key: rev_g, desc: true}
    deep_dive_top: 3

  - id: fallen_quality
    name: Beaten-down quality
    description: Profitable companies trading 25%+ below their 52-week high. Find out why.
    filters:
      mcap: {min: 2.0e9}
      off_high: {max: -0.25}
      roe: {min: 0.12}
      net_m: {min: 0.08}
    sort: {key: off_high, desc: false}
    deep_dive_top: 3

  - id: cash_machines
    name: Cash machines
    description: High free cash flow yields with conservative leverage.
    filters:
      fcf_yield: {min: 0.05}
      net_debt_ebitda: {max: 3.0}
      op_m: {min: 0.10}
    sort: {key: fcf_yield, desc: true}
    deep_dive_top: 3
