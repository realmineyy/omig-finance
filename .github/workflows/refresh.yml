name: Refresh research data

on:
  # Weekdays at 22:30 UTC (6:30pm ET), after the US close.
  schedule:
    - cron: "30 22 * * 1-5"
  # "Run workflow" button on GitHub (works from your phone) for on-demand deep dives.
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers to deep-dive now, comma-separated (e.g. NVDA,CRM)"
        required: false
        default: ""
      skip_universe:
        description: "Skip the full-market refresh (much faster; just deep dives)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test valuation math
        run: python -m pytest -q

      - name: Build research data
        env:
          TICKERS: ${{ inputs.tickers }}
          SKIP_UNIVERSE: ${{ inputs.skip_universe }}
        run: |
          args=()
          [ -n "$TICKERS" ] && args+=(--tickers "$TICKERS")
          [ "$SKIP_UNIVERSE" = "true" ] && args+=(--skip-universe)
          python -m engine.build "${args[@]}"

      - name: Commit updated data
        run: |
          git config user.name "research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data cache
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh research data $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
