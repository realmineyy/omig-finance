<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OMIG Research</title>
  <meta name="description" content="S&P 500 research terminal: best ideas by sector, DCF and trading comps.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2314213d'/><path d='M7 22l6-7 5 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply a saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem('er:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/">OMIG Research</a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="home">Dashboard</a>
        <a href="#/screener" data-nav="screener">Screener</a>
      </nav>
      <button id="settings" class="icon-btn theme" type="button" aria-label="GitHub connection settings" title="GitHub connection">⚙</button>
      <button id="theme" class="icon-btn theme" type="button" aria-label="Toggle theme">☾</button>
    </div>
  </header>
  <main id="main" class="container" aria-live="polite"></main>
  <footer class="container footer">
    <span id="updated"></span>
    <span>Data: Yahoo Finance &amp; Wikipedia, delayed and unaudited. For research and education only, not investment advice.</span>
  </footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
